<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- The 3 signature colors -->
    <!-- 1. Emerald / Ok -->
    <linearGradient id="colorGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 2. Amber / Okeish -->
    <linearGradient id="colorAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 3. Coral / Not Ok -->
    <linearGradient id="colorRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Flash symbol vibrant gradient -->
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card 1 (Red accent / back card) -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>

    <!-- Card 2 (Yellow accent / middle card) -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b3d" />
      <stop offset="100%" stop-color="#161b28" />
    </linearGradient>

    <!-- Card 3 (Green accent / front card) -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c364e" />
      <stop offset="100%" stop-color="#1b2234" />
    </linearGradient>

    <radialGradient id="flashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop shadows for depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="flashShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Perfectly squared canvas background (no rounded corners) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)" stroke="#1f2637" stroke-width="2" />
  
  <!-- Subtle center ambient aura -->
  <circle cx="256" cy="256" r="170" fill="url(#flashGlow)" />

  <!-- === CARD 1: BACK (Rotated -16 deg, with Red / Not ok accent trim) === -->
  <g transform="translate(256, 256) rotate(-16) translate(-256, -256)" filter="url(#softShadow)">
    <rect x="136" y="116" width="240" height="280" rx="28" fill="url(#card1Grad)" stroke="#ef4444" stroke-width="3" stroke-opacity="0.85" />
    <!-- Top-left accent pip -->
    <circle cx="166" cy="146" r="6" fill="#ef4444" />
    <!-- Bottom-right accent pip -->
    <circle cx="346" cy="366" r="6" fill="#ef4444" />
  </g>

  <!-- === CARD 2: MIDDLE (Rotated -2 deg, with Amber / Okeish accent trim) === -->
  <g transform="translate(256, 256) rotate(-2) translate(-256, -256)" filter="url(#softShadow)">
    <rect x="136" y="116" width="240" height="280" rx="28" fill="url(#card2Grad)" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.9" />
    <!-- Top-left accent pip -->
    <circle cx="166" cy="146" r="6" fill="#f59e0b" />
    <!-- Bottom-right accent pip -->
    <circle cx="346" cy="366" r="6" fill="#f59e0b" />
  </g>

  <!-- === CARD 3: FRONT (Rotated +12 deg, with Emerald / Ok accent trim) === -->
  <g transform="translate(256, 256) rotate(12) translate(-256, -256)" filter="url(#softShadow)">
    <rect x="136" y="116" width="240" height="280" rx="28" fill="url(#card3Grad)" stroke="#10b981" stroke-width="3.5" stroke-opacity="0.95" />
    <!-- Top-left accent pip -->
    <circle cx="166" cy="146" r="6" fill="#10b981" />
    <!-- Bottom-right accent pip -->
    <circle cx="346" cy="366" r="6" fill="#10b981" />
  </g>

  <!-- === HERO MINIMALIST FLASH / LIGHTNING SYMBOL (Central focal point) === -->
  <g transform="translate(256, 256)" filter="url(#flashShadow)">
    <path d="M6 -76 L-34 4 L6 4 L-12 76 L44 -8 L6 -8 Z" 
          fill="url(#flashGrad)" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-linejoin="round" />
  </g>
</svg>